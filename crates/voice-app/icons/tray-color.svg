<!-- Windows/Linux tray glyph. Their trays have no template images and the
     taskbar may be light or dark, so they get the full-colour mark: the
     icon.svg tile, full bleed so it does not shrink inside a 16-24 px slot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8F3D"/>
      <stop offset="1" stop-color="#F2650F"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <g fill="#FFFFFF" transform="translate(112 112) scale(8)">
    <rect x="7.5" y="12" width="13" height="38" rx="6.5"/>
    <rect x="25.5" y="26" width="13" height="46" rx="6.5"/>
    <rect x="43.5" y="46" width="13" height="42" rx="6.5"/>
    <rect x="61.5" y="26" width="13" height="46" rx="6.5"/>
    <rect x="79.5" y="12" width="13" height="38" rx="6.5"/>
  </g>
</svg>
