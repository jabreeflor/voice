name: Release

# Every push to main ships: version -> build (arm64 + x86_64) -> write and
# verify the update feed -> publish. Installed copies pick the release up from
# `releases/latest/download/latest.json` within a few hours (or at once from
# the tray's Check for Updates…), so publishing *is* shipping.
#
#   version  computes the next X.Y.Z (scripts/release-version.mjs: the next
#            patch above the highest v* tag, or tauri.conf.json's version when
#            that is higher). Nothing is committed back to main; each build
#            job stamps the version into its own checkout.
#   macos    one job per architecture: Voice.app with whisper-server inside
#            Contents/MacOS (where WhisperEngine::find_binary looks first),
#            packed into a .dmg, plus the updater archive
#            (`Voice_<v>_<arch>.app.tar.gz`) signed with the updater key.
#   publish  writes latest.json from both archives, checks that each
#            signature verifies against the pubkey compiled into the app, and
#            only then creates the release and its tag.
#
# A pull request that edits the release files builds both architectures
# (with the version it would get) and stops there; nothing is tagged or
# published.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) is the updater's minisign key,
#   the pair of plugins.updater.pubkey in tauri.release.conf.json. Without it
#   nothing can be published: installed copies refuse unsigned updates.
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD and
#   APPLE_SIGNING_IDENTITY sign with a real identity instead of ad-hoc
#   (`signingIdentity: "-"`); APPLE_ID, APPLE_PASSWORD (app-specific
#   password) and APPLE_TEAM_ID add notarization. tauri-bundler picks all of
#   them up from the environment. A stable identity is what lets macOS keep
#   Voice's Accessibility grant across updates; ad-hoc builds lose it on
#   every update (README.md, "Updates").

on:
  push:
    branches: [main]
    # Changes that cannot alter the shipped app are not a new version.
    paths-ignore:
      - "**/*.md"
      - "assets/**"
      - "scripts/install.sh"
      - "scripts/e2e-smoke.sh"
      - "scripts/tests/**"
      - ".github/workflows/ci.yml"
      - "LICENSE"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - crates/voice-app/tauri.release.conf.json
      - scripts/release-*.mjs
  # Re-ship main by hand (e.g. after fixing a secret). Publishes from main only.
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in push order. A run that is building is never
# cancelled; a newer push waits, and if several pile up only the newest
# waiting one runs. The next version is computed from the tags when a run
# starts, and the previous run's tag exists by then. Pull requests queue on
# their own ref so they never hold a release up.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Keep in step with ci.yml.
  WHISPER_CPP_TAG: v1.9.4
  # Matches bundle.macOS.minimumSystemVersion; applies to cargo and cmake.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  version:
    name: Next version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, so the next version is computed from all of them.
          fetch-depth: 0

      - id: next
        name: Next version
        run: node scripts/release-version.mjs next | tee -a "$GITHUB_OUTPUT"

  macos:
    name: Build Voice.app (${{ matrix.target }})
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            # tauri-bundler's arch suffix for the .dmg; the archive copies it.
            bundle_arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
            bundle_arch: x64

    steps:
      - uses: actions/checkout@v4

      # tauri.conf.json's version is what lands in Info.plist and what the
      # updater compares against latest.json.
      - name: Stamp the version
        run: node scripts/release-version.mjs stamp "$VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.target }}

      - name: Restore whisper.cpp build
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper-cpp-bin
          key: whisper-cpp-macos-${{ matrix.arch }}-${{ env.WHISPER_CPP_TAG }}-static-metal-${{ env.MACOSX_DEPLOYMENT_TARGET }}

      # Static libraries so the binary needs nothing outside the bundle, and the
      # Metal shaders embedded so no ggml-metal.metal file has to ship beside
      # it. GGML_NATIVE=OFF: the binary runs on users' Macs, not this runner
      # (and the x86_64 build is cross-compiled).
      - name: Build whisper-server
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_TAG" https://github.com/ggml-org/whisper.cpp.git whisper-cpp-src
          cmake -S whisper-cpp-src -B whisper-cpp-src/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper-cpp-src/build --config Release -j 4 --target whisper-server
          mkdir -p whisper-cpp-bin
          cp whisper-cpp-src/build/bin/whisper-server whisper-cpp-bin/

      # Anything linked from outside /usr/lib or /System would be missing on a
      # user's Mac (e.g. a Homebrew dylib or an @rpath to the build tree).
      - name: Check whisper-server is self-contained
        run: |
          BIN=whisper-cpp-bin/whisper-server
          lipo -archs "$BIN" | grep -qx "${{ matrix.arch }}"
          otool -L "$BIN"
          if otool -L "$BIN" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)'; then
            echo "::error::whisper-server links libraries that will not exist on users' Macs"
            exit 1
          fi

      # tauri-bundler expects externalBin files suffixed with the target triple
      # and copies them into Contents/MacOS without the suffix.
      - name: Stage sidecar
        run: |
          mkdir -p crates/voice-app/binaries
          cp whisper-cpp-bin/whisper-server "crates/voice-app/binaries/whisper-server-${{ matrix.target }}"
          chmod 755 "crates/voice-app/binaries/whisper-server-${{ matrix.target }}"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # Secrets that are not configured arrive as empty strings, which
      # tauri-bundler would treat as set; unset them so it falls back to the
      # ad-hoc identity and skips notarization. tauri.release.conf.json turns
      # on createUpdaterArtifacts, which hard-errors without the updater key:
      # a pull request from a fork (no secrets) builds without the archive
      # and can never reach publish anyway.
      - name: Build app, dmg and updater archive
        working-directory: crates/voice-app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY
            echo "::warning::no updater signing key: building without the updater archive"
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          cargo tauri build --target ${{ matrix.target }} --bundles app,dmg \
            --config tauri.release.conf.json "${extra[@]}"

      - name: Verify bundle
        run: |
          APP="target/${{ matrix.target }}/release/bundle/macos/Voice.app"
          test -x "$APP/Contents/MacOS/voice"
          test -x "$APP/Contents/MacOS/whisper-server"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$(uname -m)" = "${{ matrix.arch }}" ]; then
            "$APP/Contents/MacOS/whisper-server" --help >/dev/null
          fi
          # The updater compares this against latest.json; a stale value would
          # make every installed copy offer the same update forever.
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [ "$plist_version" != "$VERSION" ]; then
            echo "::error::Info.plist says $plist_version, expected $VERSION"
            exit 1
          fi
          ls -l target/${{ matrix.target }}/release/bundle/dmg/

      # Both architectures' archives are called Voice.app.tar.gz; name them
      # like the .dmg so they can sit side by side on one release. The
      # signature covers the bytes, not the name.
      - name: Stage release files
        run: |
          set -euo pipefail
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          cp "$BUNDLE"/dmg/*.dmg dist/
          if [ -f "$BUNDLE/macos/Voice.app.tar.gz" ]; then
            test -s "$BUNDLE/macos/Voice.app.tar.gz.sig"
            NAME="Voice_${VERSION}_${{ matrix.bundle_arch }}.app.tar.gz"
            cp "$BUNDLE/macos/Voice.app.tar.gz" "dist/$NAME"
            cp "$BUNDLE/macos/Voice.app.tar.gz.sig" "dist/$NAME.sig"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: voice-macos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The last gate before every installed copy fetches this build. Runs on a
  # runner that never saw the signing key, against what was actually built.
  publish:
    name: Publish GitHub Release
    needs: [version, macos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      # Creates the release and, with it, the tag.
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: voice-macos-*
          path: dist
          merge-multiple: true

      - name: Write the update feed
        run: node scripts/release-feed.mjs write dist "$VERSION" "$GITHUB_REPOSITORY"

      # Version matches, both darwin entries exist, and each signature
      # verifies against plugins.updater.pubkey — i.e. an installed Voice
      # will accept this, rather than silently refuse it forever.
      - name: Verify the update feed
        run: node scripts/release-feed.mjs verify dist "$VERSION"

      - name: Checksums
        working-directory: dist
        run: sha256sum *.dmg *.app.tar.gz | tee SHA256SUMS.txt

      # `gh release create` uploads every asset to a draft and publishes it
      # last, so latest.json never points at an archive that is not there
      # yet. The tag is created here, on this commit, only once everything
      # above passed: a failed run leaves no tag, and the next push reuses
      # the number.
      - name: Publish
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          Built from ${GITHUB_SHA} on main.

          ## Install on macOS

          1. Download the \`_aarch64.dmg\` for Apple silicon (M1 and later) or the \`_x64.dmg\` for Intel Macs.
          2. Open the .dmg and drag **Voice** into **Applications**.
          3. Launch Voice. If macOS says it cannot verify the developer, open **System Settings → Privacy & Security** and click **Open Anyway** (or run \`xattr -dr com.apple.quarantine /Applications/Voice.app\`).

          The transcription engine (\`whisper-server\`) is included; on first launch Voice downloads the speech model (142 MB) and asks for Microphone and Accessibility access.

          Installed copies update themselves from this release: Voice checks a minute after launch and every four hours (or from **Check for Updates…** in the menu-bar menu), downloads the update, and checks it against Voice's own signing key before offering **Restart to Update**.
          EOF
          )
          gh release create "$TAG" dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig \
            dist/latest.json dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Voice $TAG" \
            --notes "$NOTES" --generate-notes --latest
